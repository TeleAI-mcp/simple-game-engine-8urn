name: Auto Close Issues

on:
  issues:
    types: [labeled]

jobs:
  close-completed-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            if (labels.includes('completed') || labels.includes('wontfix')) {
              github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              console.log(`Closed issue #${context.issue.number} with labels: ${labels.join(', ')}`);
            } else {
              console.log(`Issue #${context.issue.number} has labels: ${labels.join(', ')} - not closing`);
            }